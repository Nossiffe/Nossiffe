<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Pierre-Eric Tessa — Tech Lead .NET, Angular et Azure, Genève">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a4fd6"/>
      <stop offset="1" stop-color="#0f1b2d"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".015"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="200" fill="url(#bg)"/>

  <path fill="url(#wave1)" d="M0,150 C200,110 380,180 600,150 C820,120 1000,185 1200,145 L1200,200 L0,200 Z">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="M0,150 C200,110 380,180 600,150 C820,120 1000,185 1200,145 L1200,200 L0,200 Z;
              M0,145 C220,180 400,115 600,155 C800,190 1020,115 1200,155 L1200,200 L0,200 Z;
              M0,150 C200,110 380,180 600,150 C820,120 1000,185 1200,145 L1200,200 L0,200 Z"/>
  </path>
  <path fill="url(#wave2)" d="M0,170 C260,140 460,195 700,165 C920,140 1060,190 1200,165 L1200,200 L0,200 Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0,170 C260,140 460,195 700,165 C920,140 1060,190 1200,165 L1200,200 L0,200 Z;
              M0,165 C240,195 480,140 700,175 C940,195 1080,145 1200,175 L1200,200 L0,200 Z;
              M0,170 C260,140 460,195 700,165 C920,140 1060,190 1200,165 L1200,200 L0,200 Z"/>
  </path>

  <circle cx="1075" cy="52" r="3" fill="#ffffff" opacity=".35"/>
  <circle cx="1120" cy="84" r="2" fill="#ffffff" opacity=".25"/>
  <circle cx="1040" cy="100" r="2.5" fill="#ffffff" opacity=".2"/>
  <circle cx="90" cy="45" r="2.5" fill="#ffffff" opacity=".25"/>
  <circle cx="140" cy="72" r="2" fill="#ffffff" opacity=".2"/>

  <text x="600" y="92" text-anchor="middle" fill="#ffffff"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5">
    Pierre-Eric Tessa
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="600" y="128" text-anchor="middle" fill="#c9d7f7"
        font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" letter-spacing="1">
    Tech Lead · .NET &amp; Angular &amp; Azure · Genève
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="1.2s" fill="freeze"/>
  </text>
</svg>
